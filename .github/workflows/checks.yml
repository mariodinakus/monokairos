name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs
      - run: |
          for file in app.js space-control.js lib/orbit-control.cjs model.js trainer.js rain-intelligence.js community-stations.js lib/station-rain-learning.cjs scripts/refresh-rain-learning.cjs geo.js alerts/monitor.mjs sky.js cosmic.js space-weather.js privacy.js forecast-core.js forecast-motion.js forecast.js api/*.js; do node --check "$file"; done
