name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs
      - run: |
          for file in app.js share-card.js sky-window.js space-control.js lib/orbit-control.cjs model.js trainer.js rain-intelligence.js community-stations.js lib/station-rain-learning.cjs scripts/refresh-rain-learning.cjs geo.js alerts/monitor.mjs sky.js cosmic.js space-weather.js privacy.js forecast-core.js forecast-motion.js forecast.js api/*.js lib/routes/*.js lib/station-verify.cjs scripts/refresh-station-verification.cjs day-compare.js yesterday-check.js rain-alerts.js mono-reliability.js trust-hub.js scripts/stamp-assets.cjs; do node --check "$file"; done
