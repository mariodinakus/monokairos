name: MONO Kairos Android APK

on:
  push:
    branches: [expo-mobile]
    paths:
      - 'mobile/**'
      - '.github/workflows/mono-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mono-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout Android app
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generate native Android app
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Compile standalone release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Confirm APK is signed
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$apk"
          test -s "$apk"
          apktool="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          "$apktool" verify --verbose "$apk"
          echo "APK_FILE=$apk" >> "$GITHUB_ENV"
          ls -lh "$apk"

      - name: Upload installable MONO v1.4.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: MONO-Kairos-Android-v1.4.0-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
